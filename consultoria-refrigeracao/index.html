<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suporte Técnico Especializado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Ajuste para ocupar exatamente a tela visível no mobile (dvh) */
        :root {
            --whatsapp-green: #075e54;
            --whatsapp-light-green: #dcf8c6;
            --whatsapp-bg: #efe7de;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html { 
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Impede scroll lateral/geral */
            background-color: #e5ddd5;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        .chat-container { 
            height: 100dvh; /* Altura dinâmica para mobile */
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #fff;
            position: relative;
        }

        .chat-header { 
            background: var(--whatsapp-green);
            color: white;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
            flex-shrink: 0;
            height: 60px;
        }

        .chat-messages { 
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-color: var(--whatsapp-bg);
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch; /* Scroll suave no iOS */
        }

        .message { 
            margin-bottom: 12px;
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
            animation: fadeIn 0.2s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .bot { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; }
        .user { background: var(--whatsapp-light-green); align-self: flex-end; border-top-right-radius: 0; }
        
        /* Triângulos das mensagens */
        .bot::before { content: ""; position: absolute; left: -10px; top: 0; border-style: solid; border-width: 0 10px 10px 0; border-color: transparent #ffffff transparent transparent; }
        .user::after { content: ""; position: absolute; right: -10px; top: 0; border-style: solid; border-width: 10px 10px 0 0; border-color: var(--whatsapp-light-green) transparent transparent transparent; }

        /* Audio Player Style */
        .wa-audio-msg { display: flex; align-items: center; gap: 10px; min-width: 200px; padding: 5px 0; }
        .wa-avatar-audio { position: relative; width: 45px; height: 45px; flex-shrink: 0; }
        .wa-mic-icon { position: absolute; bottom: -1px; right: -1px; color: #34b7f1; font-size: 14px; background: white; border-radius: 50%; padding: 1px; }
        .wa-audio-controls { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .wa-play-btn { color: #667781; font-size: 22px; cursor: pointer; width: 25px; text-align: center; }
        .wa-progress-bar { width: 100%; height: 3px; background: #d1d1d1; border-radius: 2px; }
        .wa-progress-fill { width: 0%; height: 100%; background: #00a884; position: relative; }

        /* Input Area Fix for Mobile */
        .input-area { 
            padding: 8px 12px;
            background: #f0f0f0;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #ddd;
            flex-shrink: 0;
            padding-bottom: env(safe-area-inset-bottom, 8px); /* Respeita o "home bar" do iPhone */
        }

        .input-wrapper {
            flex: 1;
            background: white;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            height: 45px;
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px; /* Evita zoom automático no iOS */
            padding: 8px 0;
        }

        .send-btn {
            background: #00a884;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            border: none;
            flex-shrink: 0;
        }

        /* Enquete & Opções */
        .options-container { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; width: 100%; }
        .option-btn { background: #fff; color: #00a884; border: 1px solid #e1e1e1; padding: 12px; border-radius: 8px; font-weight: 600; text-align: center; }
        .enquete-card { background: white; border-radius: 10px; border: 1px solid #ddd; margin-top: 10px; align-self: flex-start; width: 90%; }
        .enquete-header { padding: 12px; font-weight: 600; border-bottom: 1px solid #eee; color: #111b21; }
        .enquete-options { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .enquete-btn { width: 100%; text-align: left; padding: 12px; border: 1px solid #e9edef; border-radius: 8px; color: #00a884; font-weight: 600; background: #f8f9fa; }

        .typing { font-size: 13px; color: #666; margin-bottom: 8px; display: none; padding-left: 5px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <i class="fas fa-arrow-left text-lg"></i>
        <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center overflow-hidden">
            <img src="imagens/perfil.jpg" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=Tecnico&background=075e54&color=fff'">
        </div>
        <div class="flex-1">
            <p class="font-bold leading-tight">Consultoria Técnica</p>
            <p class="text-[11px] opacity-90">Online agora</p>
        </div>
        <div class="flex gap-4">
            <i class="fas fa-video opacity-80"></i>
            <i class="fas fa-phone opacity-80"></i>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div id="typingIndicator" class="typing">Técnico...</div>
    </div>

    <div class="input-area" id="inputArea" style="visibility: hidden;">
        <div class="input-wrapper">
            <i class="far fa-smile text-gray-500 mr-2 text-xl"></i>
            <input type="text" id="userInput" placeholder="Mensagem">
            <i class="fas fa-paperclip text-gray-500 ml-2"></i>
        </div>
        <button onclick="sendText()" class="send-btn">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://bhclopgnjyfqvevgjzxd.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoY2xvcGduanlmcXZldmdqenhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NDQwNTMsImV4cCI6MjA4OTUyMDA1M30.damLeZ4b5cEcrhjSO4xlOiGk-yuE3ZJfYSKaWXd3R94"; 

    const chatMessages = document.getElementById('chatMessages');
    const inputArea = document.getElementById('inputArea');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');

    let leadData = {
        session_id: crypto.randomUUID(),
        aparelho: '',
        defeito: '',
        status: 'visitante',
        duvida_final: '',
        historico_chat: []
    };

    let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function syncLead() {
        try {
            await supabaseClient.from('leads_conserto').upsert([leadData], { onConflict: 'session_id' });
        } catch (e) { console.error("Erro sync:", e); }
    }

    function scrollChat() { 
        setTimeout(() => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 100);
    }

    function addMessage(content, type) {
        leadData.historico_chat.push({ sender: type, text: content, time: new Date().toLocaleTimeString() });
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerText = content;
        chatMessages.insertBefore(msgDiv, typingIndicator);
        scrollChat();
        syncLead();
    }

    function addAudioMessage(audioSrc, duration) {
        leadData.historico_chat.push({ sender: 'bot', text: `[ÁUDIO: ${duration}]`, time: new Date().toLocaleTimeString() });
        const msgDiv = document.createElement('div');
        msgDiv.className = `message bot`;
        msgDiv.innerHTML = `
            <div class="wa-audio-msg">
                <div class="wa-avatar-audio">
                    <img src="imagens/perfil.jpg" class="w-full h-full rounded-full" onerror="this.src='https://ui-avatars.com/api/?name=T'">
                    <i class="fas fa-microphone wa-mic-icon"></i>
                </div>
                <div class="wa-audio-controls">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-play wa-play-btn" onclick="handleAudio(this, '${audioSrc}')"></i>
                        <div class="wa-progress-bar"><div class="wa-progress-fill"></div></div>
                    </div>
                    <div class="wa-audio-meta"><span>${duration}</span><span class="text-[9px] font-bold">ORIGINAL</span></div>
                </div>
            </div>`;
        chatMessages.insertBefore(msgDiv, typingIndicator);
        scrollChat();
        syncLead();
    }

    function handleAudio(btn, src) {
        const audio = new Audio(src);
        const fill = btn.parentElement.querySelector('.wa-progress-fill');
        if (btn.classList.contains('fa-play')) {
            btn.classList.replace('fa-play', 'fa-pause');
            audio.play().catch(() => btn.classList.replace('fa-pause', 'fa-play'));
            audio.ontimeupdate = () => fill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
            audio.onended = () => { btn.classList.replace('fa-pause', 'fa-play'); fill.style.width = '0%'; };
        } else { btn.classList.replace('fa-pause', 'fa-play'); audio.pause(); }
    }

    function toggleTyping(show) { typingIndicator.style.display = show ? 'block' : 'none'; scrollChat(); }

    function initChat() {
        syncLead();
        toggleTyping(true);
        setTimeout(() => {
            toggleTyping(false);
            addMessage("Olá! Sou especialista em Refrigeração. Qual aparelho está precisando de manutenção?", "bot");
            const opt = document.createElement('div');
            opt.className = 'options-container';
            opt.id = 'step-aparelho';
            opt.innerHTML = `<button class="option-btn" onclick="selectAparelho('Geladeira')">Geladeira</button><button class="option-btn" onclick="selectAparelho('Máquina de Lavar')">Máquina de Lavar</button>`;
            chatMessages.insertBefore(opt, typingIndicator);
        }, 1500);
    }

    function selectAparelho(val) {
        leadData.aparelho = val;
        leadData.status = 'interagindo';
        addMessage(val, "user");
        document.getElementById('step-aparelho')?.remove();
        toggleTyping(true);
        setTimeout(() => {
            toggleTyping(false);
            addMessage(`Qual defeito essa ${val} está apresentando?`, "bot");
            inputArea.style.visibility = 'visible';
            userInput.focus();
        }, 1000);
    }

    function sendText() {
        const val = userInput.value.trim();
        if(!val) return;
        addMessage(val, "user");
        userInput.value = '';
        if(leadData.status === 'aguardando_duvida') {
            leadData.duvida_final = val;
            leadData.status = 'duvida_enviada';
            inputArea.style.visibility = 'hidden';
            setTimeout(() => addMessage("Vou analisar sua dúvida e te retorno!", "bot"), 1000);
            return;
        }
        leadData.defeito = val;
        inputArea.style.visibility = 'hidden';
        processFlow();
    }

    function processFlow() {
        setTimeout(() => { toggleTyping(true); }, 1000);
        setTimeout(() => {
            toggleTyping(false);
            addAudioMessage("audio/audio1.mp3", "0:43");
            setTimeout(() => {
                toggleTyping(true);
                setTimeout(() => {
                    toggleTyping(false);
                    addAudioMessage("audio/audio2.mp3", "0:38");
                    setTimeout(showEnquete, 1000);
                }, 4000);
            }, 2000);
        }, 1500);
    }

    function showEnquete() {
        const enquete = document.createElement('div');
        enquete.className = 'enquete-card';
        enquete.id = 'final-enquete';
        enquete.innerHTML = `
            <div class="enquete-header">Deseja seguir com a consultoria agora?</div>
            <div class="enquete-options">
                <button class="enquete-btn" style="background: #e7f6f2;" onclick="choice('Sim')">Sim, quero resolver agora! ✅</button>
                <button class="enquete-btn" onclick="choice('Dúvida')">Tenho uma dúvida 🤔</button>
                <button class="enquete-btn" onclick="choice('Não')">Não, obrigado ❌</button>
            </div>`;
        chatMessages.insertBefore(enquete, typingIndicator);
        scrollChat();
    }

    function choice(c) {
        document.getElementById('final-enquete')?.remove();
        addMessage(c === 'Dúvida' ? "Tenho uma dúvida 🤔" : c === 'Sim' ? "Sim, quero resolver!" : "Não, obrigado", "user");
        if(c === 'Dúvida') {
            leadData.status = 'aguardando_duvida';
            setTimeout(() => { addMessage("Qual sua dúvida?", "bot"); inputArea.style.visibility = 'visible'; userInput.focus(); }, 1000);
        } else if(c === 'Sim') {
            leadData.status = 'aceitou';
            setTimeout(() => addMessage("Gerando código Pix de R$ 27,00...", "bot"), 1000);
        } else {
            leadData.status = 'recusou';
            setTimeout(() => addMessage("Até a próxima!", "bot"), 1000);
        }
    }

    // Corrigir visualização quando teclado abre
    userInput.addEventListener('focus', () => {
        setTimeout(scrollChat, 300);
    });

    window.onload = initChat;
    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendText(); });
</script>
</body>
</html>
