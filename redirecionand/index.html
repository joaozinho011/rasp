<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center; /* Alinha tudo ao centro verticalmente */
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    /* Container geral do conteúdo */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-top {
      width: 300px;
      max-width: 80%;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      color: #28a745;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin: 5px 0;
    }

    .countdown {
      font-size: 22px;
      font-weight: bold;
      margin-top: 15px;
      color: #000;
    }

    .loading-gif {
      width: 80px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="img/recebedor.png" alt="Prêmio da Rifa" class="logo-top">

    <h1>Aguarde!</h1>
    <p>Você está sendo direcionado para o site oficial sorteiosmantuani.com</p>
    <p class="countdown">Redirecionando em <span id="timer">3</span>...</p>

    <img src="img/loading.gif" alt="Carregando..." class="loading-gif">
  </div>

  <script>
    let segundos = 3; 
    const timerElement = document.getElementById("timer");
    const linkGrupo = "https://sorteiosmantuani.com/sorteio/corolla-gr-2025-start-160-2025-0km-226";

    const countdown = setInterval(() => {
      segundos--;
      timerElement.textContent = segundos;

      if (segundos <= 0) {
        clearInterval(countdown);
        window.location.href = linkGrupo;
      }
    }, 1000);
  </script>

</body>
</html>
