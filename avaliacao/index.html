<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Opinião é Importante - Serviços de Refrigeração</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus+Jakarta+Sans', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .profile-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .profile-img:hover {
            transform: scale(1.05);
        }
        .btn-google {
            background: #4285F4;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-google:hover {
            background: #3367d6;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(66, 133, 244, 0.4);
        }
        .floating {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md w-full glass-card rounded-3xl p-8 text-center animate-in fade-in duration-700">
        
        <!-- Área da Foto de Perfil -->
        <div class="relative inline-block mb-6">
            <div class="absolute -inset-1 bg-gradient-to-r from-blue-400 to-cyan-400 rounded-full blur opacity-25 group-hover:opacity-100 transition duration-1000 group-hover:duration-200"></div>
            <!-- Substitua 'imagens/perfil.jpg' pelo caminho real da sua imagem -->
            <img src="imagens/joao.png" 
                 alt="Foto de Perfil" 
                 class="profile-img relative"
                 onerror="this.src='https://ui-avatars.com/api/?name=Refrigeracao&background=0ea5e9&color=fff&size=128'">
        </div>

        <!-- Título e Saudação -->
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Obrigado pela confiança!</h1>
        <p class="text-gray-600 mb-8 leading-relaxed">
            Ficamos muito felizes em realizar o seu serviço. Sua satisfação é nossa prioridade número um!
        </p>

        <!-- Divisor Decorativo -->
        <div class="flex justify-center space-x-1 mb-8">
            <div class="w-8 h-1 bg-blue-500 rounded-full"></div>
            <div class="w-2 h-1 bg-blue-300 rounded-full"></div>
            <div class="w-1 h-1 bg-blue-200 rounded-full"></div>
        </div>

        <!-- Chamada para Ação -->
        <div class="bg-blue-50 rounded-2xl p-6 mb-8 border border-blue-100">
            <p class="text-blue-800 font-semibold mb-3">Pode nos dar uma mãozinha?</p>
            <p class="text-sm text-blue-600">
                Leva menos de 1 minuto para nos avaliar no Google. Isso ajuda muito nosso trabalho!
            </p>
        </div>

        <!-- Botão de Avaliação -->
        <a href="https://g.page/r/CfikxFgfb-dyEAE/review" 
           target="_blank" 
           class="btn-google w-full py-4 px-6 rounded-xl text-white font-bold flex items-center justify-center space-x-3 mb-4">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                <path d="M12.48 10.92v3.28h7.84c-.24 1.84-2.21 5.42-7.84 5.42-4.86 0-8.81-4.01-8.81-8.91s3.95-8.91 8.81-8.91c2.76 0 4.61 1.15 5.67 2.15l2.59-2.5c-1.66-1.55-3.82-2.5-8.26-2.5C5.48 1 0 6.48 0 13.14s5.48 12.14 12.48 12.14c7.31 0 12.16-5.14 12.16-12.37 0-.83-.09-1.47-.2-2.1h-11.96z"/>
            </svg>
            <span>AVALIAR NO GOOGLE</span>
        </a>

        </div>

        <p class="mt-8 text-xs text-gray-400 uppercase tracking-widest">
            João Marcus - Especialista em Refrigeração
        </p>
    </div>
