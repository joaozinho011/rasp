<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Designer Industrial Pro - Edição Suprema</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background: #05070a;
      color: #f1f5f9;
      margin: 0;
      overflow: hidden;
      height: 100vh;
      touch-action: none; /* Impede zoom/scroll nativo do navegador no mobile */
    }

    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      cursor: grab;
      touch-action: none;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      width: 10000px;
      height: 10000px;
      pointer-events: none;
    }

    .node {
      position: absolute;
      z-index: 10;
      min-width: 140px; /* Um pouco menor para mobile */
      min-height: 160px;
      pointer-events: auto;
      user-select: none;
      touch-action: none;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border: 2px solid #1e293b;
      border-radius: 12px;
      padding: 8px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      pointer-events: none;
      transition: border-color 0.2s;
    }

    .node:hover .glass-card { border-color: #38bdf8; }

    /* Handles de interação maiores para toque */
    .drag-handle {
      position: absolute;
      inset: 0; /* Cobre todo o card para facilitar arrastar no mobile */
      cursor: grab;
      z-index: 5;
      pointer-events: auto;
    }
    
    /* Botões dentro do card precisam estar acima do drag-handle */
    .card-actions {
      position: relative;
      z-index: 10;
      pointer-events: auto;
    }

    .conn-handle {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px; /* Maior para toque */
      height: 40px;
      background: #38bdf8;
      border-radius: 50%;
      cursor: pointer;
      z-index: 20;
      border: 3px solid #05070a;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      transition: transform 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .conn-handle:active, .conn-handle:hover { transform: translateX(-50%) scale(1.1); }
    .conn-handle::after { content: '+'; font-weight: 900; color: #000; font-size: 20px; }

    .node.connecting-source .conn-handle {
      background: #fff;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.3); box-shadow: 0 0 20px #fff; }
    }

    .resizer {
      width: 30px; /* Maior para toque */
      height: 30px;
      position: absolute;
      right: 0;
      bottom: 0;
      cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 50%, #38bdf8 50%);
      border-radius: 0 0 12px 0;
      z-index: 15;
      pointer-events: auto;
    }

    #svg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .line-label {
      font-size: 12px;
      font-weight: 900;
      fill: #fff;
      paint-order: stroke;
      stroke: #000;
      stroke-width: 4px;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
    }

    /* Toolbar Responsiva */
    .toolbar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      max-width: 95vw;
      overflow-x: auto; /* Permite rolagem lateral em telas pequenas */
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }

    /* Esconde barra de rolagem da toolbar mas mantém funcionalidade */
    .toolbar::-webkit-scrollbar { display: none; }
    .toolbar { -ms-overflow-style: none; scrollbar-width: none; }

    .tool-btn {
      padding: 8px 14px;
      border-radius: 8px;
      background: #1e293b;
      font-size: 12px;
      font-weight: 800;
      transition: 0.2s;
      color: white;
      flex-shrink: 0; /* Impede encolhimento */
    }
    .tool-btn:hover { background: #38bdf8; color: #000; }

    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #334155; /* Borda padrão para ver o preto */
      flex-shrink: 0;
    }
    .active-color { border-color: white; transform: scale(1.2); box-shadow: 0 0 10px rgba(255,255,255,0.3); }

    .persistent-line { pointer-events: auto; cursor: pointer; fill: none; stroke-linecap: round; transition: stroke-width 0.2s; }
    .persistent-line:hover { stroke-width: 10; opacity: 0.8; }

    /* Dropdown ajustado para mobile */
    .dropdown { position: relative; }
    .dropdown-content {
      display: none;
      position: absolute;
      bottom: 110%; /* Sobe um pouco mais */
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      min-width: 200px;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      z-index: 1001;
      max-height: 50vh;
      overflow-y: auto;
    }
    .dropdown.active .dropdown-content { display: block; } /* Classe active para mobile */
    .dropdown:hover .dropdown-content { display: block; } /* Hover para desktop */
    
    .dropdown-item {
      padding: 10px 12px; /* Área de toque maior */
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      color: #cbd5e1;
    }
    .dropdown-item:hover { background: #38bdf8; color: #000; }

    .icon-container svg { pointer-events: none; }

    /* Controles Superiores Responsivos */
    .top-controls {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 50;
      align-items: flex-end;
    }

    .status-badge {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      backdrop-filter: blur(4px);
    }

    .scale-control {
      background: rgba(15, 23, 42, 0.9);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    @media (max-width: 600px) {
      .toolbar {
        bottom: 10px;
        padding: 8px;
        width: 90%;
        justify-content: space-between;
      }
      .node { min-width: 120px; min-height: 140px; }
      .dropdown-content { position: fixed; bottom: 80px; left: 50%; width: 80%; }
    }
  </style>
</head>
<body>

  <!-- Status fixo no topo esquerdo -->
  <div id="status-tag" class="fixed top-4 left-4 status-badge z-50 pointer-events-none">
    PROJETO: MOTOR VIVO
  </div>

  <!-- Controles Superiores -->
  <div class="top-controls">
    <div class="scale-control">
      <label class="text-[9px] font-black text-slate-500 uppercase">Tamanho Ícones</label>
      <input type="range" min="0.5" max="2.5" step="0.1" value="1" oninput="updateIconScale(this.value)" class="w-24 accent-sky-500">
    </div>
    <button onclick="clearAll()" class="bg-red-900/50 text-red-400 border border-red-800 px-3 py-1 rounded-lg text-[10px] font-bold hover:bg-red-800 hover:text-white transition">
      LIMPAR TUDO
    </button>
  </div>

  <div id="viewport">
    <div id="canvas">
      <svg id="svg-layer">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="context-stroke" />
          </marker>
        </defs>
      </svg>
    </div>
  </div>

  <div class="toolbar">
    <div class="flex gap-1 shrink-0">
      <button class="tool-btn" onclick="changeZoom(0.1)">+</button>
      <button class="tool-btn" onclick="changeZoom(-0.1)">-</button>
    </div>

    <div class="w-px h-6 bg-slate-700 shrink-0"></div>

    <div class="dropdown" id="add-dropdown" onclick="toggleDropdown()">
      <button class="tool-btn bg-sky-600 shrink-0">ADICIONAR ▼</button>
      <div class="dropdown-content">
        <div class="dropdown-item" onclick="spawn('ESP32 Master', 'CONTROLE', 'esp32')">ESP32</div>
        <div class="dropdown-item" onclick="spawn('Tela Principal', 'OLED', 'display')">Tela OLED</div>
        <div class="dropdown-item" onclick="spawn('Sensor Umid', 'INPUT', 'sensor')">Sensor</div>
        <div class="dropdown-item" onclick="spawn('Relé Atuador', 'SWITCH', 'relay')">Relé</div>
        <div class="dropdown-item" onclick="spawn('Compressor', 'CARGA', 'motor')">Compressor</div>
        <div class="dropdown-item" onclick="spawn('Fonte 5V', 'POWER', 'power')">Fonte 5V</div>
        <div class="dropdown-item" onclick="spawn('Tomada AC', '220V', 'plug')">Tomada</div>
        <div class="dropdown-item" onclick="spawn('Contatora', 'AC', 'contactor')">Contatora</div>
        <div class="dropdown-item" onclick="spawn('Resistor', 'COMP.', 'resistor')">Resistor</div>
        <hr class="border-slate-700 my-1">
        <div class="dropdown-item text-sky-400" onclick="spawn('Novo Item', 'LIVRE', 'esp32')">+ Item Livre</div>
      </div>
    </div>
    
    <div class="w-px h-6 bg-slate-700 shrink-0"></div>
    
    <div class="flex gap-2 shrink-0 items-center">
      <div class="color-dot bg-red-600 active-color" data-color="#ef4444" onclick="setLineColor('#ef4444', this)"></div>
      <div class="color-dot bg-blue-500" data-color="#3b82f6" onclick="setLineColor('#3b82f6', this)"></div>
      <div class="color-dot bg-green-500" data-color="#22c55e" onclick="setLineColor('#22c55e', this)"></div>
      <div class="color-dot bg-yellow-400" data-color="#facc15" onclick="setLineColor('#facc15', this)"></div>
      <div class="color-dot bg-white" data-color="#ffffff" onclick="setLineColor('#ffffff', this)"></div>
      <!-- Nova cor preta adicionada -->
      <div class="color-dot bg-black border-slate-500" data-color="#000000" onclick="setLineColor('#000000', this)" title="Preto"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const svgLayer = document.getElementById('svg-layer');
    const viewport = document.getElementById('viewport');
    
    // Estado Global
    let scale = 0.8;
    let iconScale = 1;
    let panX = window.innerWidth / 2 - 2500;
    let panY = window.innerHeight / 2 - 2500;
    
    let activeNode = null;
    let resizerData = null;
    let isPanning = false;
    let lastMousePos = { x: 0, y: 0 }; // Para calcular delta no touch
    
    let currentLineColor = '#ef4444';
    let connState = { active: false, sourceId: null };
    let connections = [];
    let nodesData = []; // Armazena dados dos nós para salvar
    let tempLine = null;

    // Ícones SVG
    const icons = {
      esp32: `<svg viewBox="0 0 100 100" class="w-16 h-16"><rect x="25" y="20" width="50" height="70" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><path d="M35 30h30M35 40h30" stroke="#38bdf8" opacity="0.5"/><rect x="40" y="55" width="20" height="15" fill="#38bdf8"/></svg>`,
      display: `<svg viewBox="0 0 100 100" class="w-16 h-16"><rect x="15" y="30" width="70" height="40" rx="2" fill="#000" stroke="#fff"/><text x="50" y="55" font-size="8" fill="#fff" text-anchor="middle">128x64</text></svg>`,
      sensor: `<svg viewBox="0 0 100 100" class="w-16 h-16"><circle cx="50" cy="50" r="30" fill="#064e3b" stroke="#22c55e"/><path d="M50 35v30M35 50h30" stroke="#fff"/></svg>`,
      relay: `<svg viewBox="0 0 100 100" class="w-16 h-16"><rect x="25" y="25" width="50" height="50" fill="#450a0a" stroke="#ef4444"/><path d="M40 50h20M55 40l10 20" stroke="#fff" fill="none"/></svg>`,
      motor: `<svg viewBox="0 0 100 100" class="w-16 h-16"><circle cx="50" cy="50" r="35" fill="#1e293b" stroke="#facc15"/><path d="M50 15v15M85 50h-15" stroke="#facc15"/><circle cx="50" cy="50" r="10" fill="#facc15"/></svg>`,
      power: `<svg viewBox="0 0 100 100" class="w-16 h-16"><rect x="20" y="30" width="60" height="40" fill="#1e293b" stroke="#fff"/><text x="50" y="55" fill="#fff" font-size="10" text-anchor="middle">5V DC</text></svg>`,
      plug: `<svg viewBox="0 0 100 100" class="w-16 h-16"><circle cx="50" cy="50" r="35" fill="#334155"/><rect x="40" y="45" width="6" height="15" rx="3" fill="#fff"/><rect x="54" y="45" width="6" height="15" rx="3" fill="#fff"/></svg>`,
      contactor: `<svg viewBox="0 0 100 100" class="w-16 h-16"><rect x="30" y="20" width="40" height="60" fill="#111" stroke="#94a3b8"/><path d="M35 30h30M35 40h30" stroke="#94a3b8" stroke-width="2"/></svg>`,
      resistor: `<svg viewBox="0 0 100 100" class="w-16 h-16"><path d="M10 50h15l5-15 10 30 10-30 10 30 5-15h15" fill="none" stroke="#facc15" stroke-width="3"/></svg>`
    };

    // --- Sistema de Persistência (Salvamento) ---
    function saveState() {
      const state = {
        nodes: nodesData,
        connections: connections,
        view: { x: panX, y: panY, scale: scale, iconScale: iconScale }
      };
      localStorage.setItem('designer_industrial_v2', JSON.stringify(state));
      // console.log("Projeto salvo!");
    }

    function loadState() {
      const saved = localStorage.getItem('designer_industrial_v2');
      if (saved) {
        try {
          const state = JSON.parse(saved);
          // Restaurar View
          if(state.view) {
            panX = state.view.x;
            panY = state.view.y;
            scale = state.view.scale;
            iconScale = state.view.iconScale || 1;
            document.querySelector('input[type="range"]').value = iconScale;
          }
          // Restaurar Nós
          if (state.nodes) {
            state.nodes.forEach(n => {
              createNode(n.name, n.type, n.icon, n.x, n.y, n.w, n.h, n.id);
            });
          }
          // Restaurar Conexões
          if (state.connections) {
            connections = state.connections;
          }
          draw();
          updateTransform();
          updateIconScale(iconScale);
          return true; // Carregou com sucesso
        } catch(e) {
          console.error("Erro ao carregar save:", e);
          return false;
        }
      }
      return false;
    }

    function clearAll() {
      if(confirm("Tem certeza que deseja apagar todo o projeto?")) {
        localStorage.removeItem('designer_industrial_v2');
        location.reload();
      }
    }

    function init() {
      if (!loadState()) {
        // Projeto Padrão se não houver save
        createNode('ESP32 Master', 'CONTROLE', 'esp32', 2420, 2400);
        createNode('Tomada AC', '220V', 'plug', 2150, 2200);
        createNode('Fonte 5V', 'POWER', 'power', 2150, 2420);
        createNode('Sensor Temp', 'INPUT', 'sensor', 2150, 2650);
        createNode('Tela OLED', 'SAÍDA', 'display', 2420, 2150);
        createNode('Relé Aux', 'SWITCH', 'relay', 2750, 2300);
        createNode('Contatora', 'AC', 'contactor', 2750, 2550);
        createNode('Compressor', 'CARGA', 'motor', 3050, 2450);
      }
      updateTransform();
      updateIconScale(iconScale);
    }

    // --- Lógica Principal ---

    function updateTransform() {
      canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      saveState();
    }

    function changeZoom(delta) {
      scale = Math.max(0.1, Math.min(2.5, scale + delta));
      updateTransform();
    }

    function updateIconScale(val) {
      iconScale = val;
      document.querySelectorAll('.icon-container').forEach(c => c.style.transform = `scale(${val})`);
      saveState();
    }

    function toggleDropdown() {
      const d = document.getElementById('add-dropdown');
      d.classList.toggle('active');
    }

    function spawn(n, t, i) {
      const x = (window.innerWidth / 2 - panX) / scale - 80;
      const y = (window.innerHeight / 2 - panY) / scale - 90;
      createNode(n, t, i, x, y);
      document.getElementById('add-dropdown').classList.remove('active');
      saveState();
    }

    function setLineColor(c, el) {
      currentLineColor = c;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active-color'));
      el.classList.add('active-color');
    }

    function createNode(name, type, icon, x, y, w, h, savedId) {
      const id = savedId || 'id_' + Math.random().toString(36).substr(2, 9);
      
      // Atualiza ou adiciona aos dados
      const existingIdx = nodesData.findIndex(n => n.id === id);
      const nodeData = { id, name, type, icon, x, y, w: w || 'auto', h: h || 'auto' };
      if (existingIdx >= 0) nodesData[existingIdx] = nodeData;
      else nodesData.push(nodeData);

      const div = document.createElement('div');
      div.className = 'node';
      div.id = id;
      div.style.left = x + 'px';
      div.style.top = y + 'px';
      if(w && w !== 'auto') div.style.width = w;
      if(h && h !== 'auto') div.style.height = h;
      
      div.innerHTML = `
        <div class="conn-handle"></div>
        <div class="drag-handle"></div>
        <div class="glass-card">
          <span class="text-[8px] font-black text-sky-400 mb-2 uppercase tracking-tighter pointer-events-none">${type}</span>
          <div class="icon-container flex-1 flex items-center justify-center pointer-events-none" style="transform: scale(${iconScale})">
            ${icons[icon] || icons.esp32}
          </div>
          <div class="text-[11px] font-bold text-white text-center mt-2 pointer-events-none">${name}</div>
          <div class="card-actions mt-2">
            <button class="text-[9px] text-red-500 font-black hover:text-white bg-red-900/20 px-2 py-1 rounded" onclick="deleteNode('${id}')">REMOVER</button>
          </div>
        </div>
        <div class="resizer"></div>
      `;

      // Evento de Conexão
      div.querySelector('.conn-handle').addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if(!connState.active) {
          connState.active = true;
          connState.sourceId = id;
          div.classList.add('connecting-source');
          document.getElementById('status-tag').innerText = "CLIQUE EM OUTRO COMPONENTE";
          
          const r = div.getBoundingClientRect();
          const startX = (r.left + r.width/2 - panX) / scale;
          const startY = (r.top - panY) / scale;
          tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          tempLine.setAttribute('stroke', currentLineColor);
          tempLine.setAttribute('stroke-width', '4');
          tempLine.setAttribute('stroke-dasharray', '8,4');
          tempLine.setAttribute('x1', startX); tempLine.setAttribute('y1', startY);
          tempLine.setAttribute('x2', startX); tempLine.setAttribute('y2', startY);
          svgLayer.appendChild(tempLine);
        } else cancelConn();
      });

      // Evento para completar conexão ao clicar no nó
      div.addEventListener('click', (e) => {
        if (connState.active && connState.sourceId !== id) {
          e.stopPropagation();
          const label = prompt("Nome da linha (Ex: GND, VCC, SINAL):", "FIO " + (connections.length + 1));
          if (label !== null) {
            connections.push({
              id: Date.now(),
              from: connState.sourceId,
              to: id,
              color: currentLineColor,
              label: label.toUpperCase()
            });
            saveState();
          }
          cancelConn();
          draw();
        }
      });

      // Lógica de Arraste (Mouse + Touch)
      const handle = div.querySelector('.drag-handle');
      
      function startDrag(clientX, clientY) {
        if (connState.active) return;
        const r = div.getBoundingClientRect();
        activeNode = { 
          node: div, 
          data: nodeData,
          ox: (clientX - r.left)/scale, 
          oy: (clientY - r.top)/scale 
        };
      }

      handle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        startDrag(e.clientX, e.clientY);
      });

      handle.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        const touch = e.touches[0];
        startDrag(touch.clientX, touch.clientY);
      }, {passive: false});

      // Resizer
      const resizer = div.querySelector('.resizer');
      function startResize(clientX, clientY) {
        resizerData = { 
          node: div, 
          data: nodeData,
          sw: div.offsetWidth, 
          sh: div.offsetHeight, 
          sx: clientX, 
          sy: clientY 
        };
      }

      resizer.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        startResize(e.clientX, e.clientY);
      });
      resizer.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        const touch = e.touches[0];
        startResize(touch.clientX, touch.clientY);
      }, {passive: false});

      canvas.appendChild(div);
      draw();
    }

    function cancelConn() {
      connState.active = false;
      connState.sourceId = null;
      if (tempLine) tempLine.remove();
      tempLine = null;
      document.querySelectorAll('.node').forEach(n => n.classList.remove('connecting-source'));
      document.getElementById('status-tag').innerText = "STATUS: AGUARDANDO";
    }

    // --- Movimentação Global (Mouse + Touch) ---

    function handleMove(clientX, clientY) {
      const curX = (clientX - panX) / scale;
      const curY = (clientY - panY) / scale;

      if (activeNode) {
        const nx = curX - activeNode.ox;
        const ny = curY - activeNode.oy;
        activeNode.node.style.left = nx + 'px';
        activeNode.node.style.top = ny + 'px';
        // Atualiza dados em tempo real
        activeNode.data.x = nx;
        activeNode.data.y = ny;
        draw();
      } else if (resizerData) {
        const nw = Math.max(140, resizerData.sw + (clientX - resizerData.sx)/scale);
        const nh = Math.max(160, resizerData.sh + (clientY - resizerData.sy)/scale);
        resizerData.node.style.width = nw + 'px';
        resizerData.node.style.height = nh + 'px';
        resizerData.data.w = nw + 'px';
        resizerData.data.h = nh + 'px';
        draw();
      } else if (connState.active && tempLine) {
        tempLine.setAttribute('x2', curX);
        tempLine.setAttribute('y2', curY);
      } else if (isPanning) {
        const dx = clientX - lastMousePos.x;
        const dy = clientY - lastMousePos.y;
        panX += dx;
        panY += dy;
        updateTransform();
      }
      lastMousePos = { x: clientX, y: clientY };
    }

    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => {
      // e.preventDefault(); // Impede scroll da página
      if(e.touches.length === 1) {
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, {passive: false});

    function handleEnd() {
      if(activeNode || resizerData) saveState(); // Salva ao soltar
      activeNode = null;
      resizerData = null;
      isPanning = false;
    }

    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchend', handleEnd);

    // Panning no Viewport
    viewport.addEventListener('mousedown', (e) => {
      if (e.target === viewport) {
        isPanning = true;
        lastMousePos = { x: e.clientX, y: e.clientY };
      }
    });
    
    viewport.addEventListener('touchstart', (e) => {
      if (e.target === viewport && e.touches.length === 1) {
        isPanning = true;
        lastMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    });

    function deleteNode(id) {
      if(confirm("Remover este componente?")) {
        connections = connections.filter(c => c.from !== id && c.to !== id);
        nodesData = nodesData.filter(n => n.id !== id);
        document.getElementById(id).remove();
        draw();
        saveState();
      }
    }

    function editLabel(id) {
      const c = connections.find(conn => conn.id === id);
      if(!c) return;
      const newLabel = prompt("Alterar nome da linha:", c.label);
      if(newLabel !== null) {
        c.label = newLabel.toUpperCase();
        draw();
        saveState();
      }
    }

    function draw() {
      svgLayer.querySelectorAll('.persistent-line, .label-group').forEach(el => el.remove());
      const pairCounts = {};

      connections.forEach(c => {
        const n1 = document.getElementById(c.from);
        const n2 = document.getElementById(c.to);
        if (!n1 || !n2) return;

        const r1 = n1.getBoundingClientRect();
        const r2 = n2.getBoundingClientRect();

        const x1 = (r1.left + r1.width/2 - panX)/scale;
        const y1 = (r1.top + r1.height/2 - panY)/scale;
        const x2 = (r2.left + r2.width/2 - panX)/scale;
        const y2 = (r2.top + r2.height/2 - panY)/scale;

        const pairKey = [c.from, c.to].sort().join('-');
        pairCounts[pairKey] = (pairCounts[pairKey] || 0) + 1;
        const offset = (pairCounts[pairKey] - 1) * 50;

        const dx = x2 - x1;
        const dy = y2 - y1;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const mx = (x1 + x2)/2 + (-dy/dist) * offset;
        const my = (y1 + y2)/2 + (dx/dist) * offset;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const pId = 'p_' + c.id;
        path.setAttribute('id', pId);
        path.setAttribute('d', offset === 0 ? `M ${x1} ${y1} L ${x2} ${y2}` : `M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`);
        path.setAttribute('stroke', c.color);
        path.setAttribute('stroke-width', '5');
        path.setAttribute('marker-end', 'url(#arrow)');
        path.setAttribute('class', 'persistent-line');
        path.onclick = (e) => { 
          e.stopPropagation();
          if(confirm("Excluir esta linha?")) { 
            connections = connections.filter(con => con.id !== c.id); 
            draw(); 
            saveState();
          } 
        };
        svgLayer.appendChild(path);

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'label-group');
        g.innerHTML = `<text dy="-12"><textPath href="#${pId}" startOffset="50%" text-anchor="middle" class="line-label" onclick="editLabel(${c.id})">${c.label || '...'}</textPath></text>`;
        svgLayer.appendChild(g);
      });
    }

    init();
  </script>
</body>
</html>
